<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8B1E2D">
<title>Wedding Invitation</title>
<meta name="description" content="Wedding Invitation">

<!-- WhatsApp / social link preview -->
<meta property="og:type" content="website">
<meta property="og:title" id="og-title" content="Wedding Invitation">
<meta property="og:description" id="og-desc" content="Wedding Invitation">
<meta property="og:image" content="assets/images/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128150;</text></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<noscript>
  <div class="noscript-note">
    <p>This invitation needs JavaScript to open.</p>
    <p>Please turn on JavaScript in your browser and reload this page.</p>
  </div>
</noscript>

<!-- ============ ENVELOPE OPENING SCREEN ============ -->
<div class="envelope-screen" id="envelopeScreen">
  <div class="env-stage">
    <div class="envelope" id="envelope">

      <!-- the card that slides out -->
      <div class="env-card" id="envCard">
        <div class="env-card-inner">
          <span class="env-card-orn">&#9670;</span>
          <p class="env-card-kicker" data-ui="youAreInvited"></p>
          <p class="env-card-names">
            <span data-field="couple.groom.name"></span>
            <em>&amp;</em>
            <span data-field="couple.bride.name"></span>
          </p>
          <span class="env-card-rule"></span>
          <p class="env-card-date" data-field="weddingDateText"></p>
        </div>
      </div>

      <!-- envelope body -->
      <div class="env-back"></div>
      <div class="env-pocket"></div>
      <div class="env-flap" id="envFlap"></div>

      <!-- wax seal -->
      <button class="seal" id="seal" type="button" aria-label="Open the invitation">
        <span class="seal-ring"></span>
        <span class="seal-text" data-ui="tapToOpen"></span>
      </button>
    </div>

    <p class="env-caption">
      <span class="env-caption-line"></span>
      <span data-ui="youAreInvited"></span>
      <span class="env-caption-line"></span>
    </p>
  </div>
  <div class="light-burst" id="lightBurst"></div>
</div>


<!-- ============ FLOATING CONTROLS ============ -->
<button class="ctrl ctrl-sound" id="soundBtn" type="button" aria-label="Toggle music" hidden>
  <svg viewBox="0 0 24 24" class="ic-on"  aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a6.8 6.8 0 0 1 0 13.4v2.1a8.9 8.9 0 0 0 0-17.6z"/></svg>
  <svg viewBox="0 0 24 24" class="ic-off" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm18.5-1.1L20.1 6.5 17.6 9l-2.5-2.5-1.4 1.4L16.2 10.4l-2.5 2.5 1.4 1.4 2.5-2.5 2.5 2.5 1.4-1.4-2.5-2.5 2.5-2.5z"/></svg>
</button>


<div class="petals" id="petals" aria-hidden="true"></div>


<!-- ============ THE INVITATION ============ -->
<main class="invite" id="invite">

  <!-- ---------- HERO ---------- -->
  <section class="hero" id="hero">
    <div class="hero-bg"></div>
    <div class="hero-arch">
      <div class="hero-inner">
        <span class="heart-sm">&#9829;</span>
        <p class="hero-welcome" data-ui="welcome"></p>
        <span class="orn-rule"><i>&#9670;</i></span>

        <h1 class="name-script" data-field="couple.groom.name"></h1>
        <p class="name-meta">
          <span data-field="couple.groom.parents"></span>
        </p>

        <p class="amp">&amp;</p>

        <h1 class="name-script" data-field="couple.bride.name"></h1>
        <p class="name-meta">
          <span data-field="couple.bride.parents"></span>
        </p>
      </div>
    </div>
    <div class="scroll-cue">
      <span data-ui="scroll"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </div>
  </section>


  <!-- ---------- SCRATCH TO REVEAL ---------- -->
  <section class="sec sec-scratch reveal">
    <h2 class="sec-title" data-field="scratch.heading"></h2>
    <div class="scratch-wrap">
      <div class="scratch-heart" id="scratchHeart">
        <div class="scratch-under">
          <p class="scratch-date"  data-field="weddingDateText"></p>
          <p class="scratch-day"   data-field="weddingDayText"></p>
          <p class="scratch-time"  data-field="weddingTimeText"></p>
        </div>
        <canvas class="scratch-canvas" id="scratchCanvas"></canvas>
      </div>
    </div>
    <p class="scratch-hint" id="scratchHint" data-field="scratch.hint"></p>
    <button class="btn btn-save" id="saveDateBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v3.6M16 3v3.6"/></svg>
      <span data-field="scratch.saveLabel"></span>
    </button>
  </section>


  <!-- ---------- OUR FOREVER BEGINS ---------- -->
  <section class="sec sec-forever reveal">
    <h2 class="sec-title" data-field="forever.heading"></h2>
    <div class="forever-heart">
      <svg viewBox="0 0 120 110" aria-hidden="true">
        <path class="heart-path" d="M60 100 C 20 72, 4 48, 4 32 A 28 28 0 0 1 60 22 A 28 28 0 0 1 116 32 C 116 48, 100 72, 60 100 Z"/>
      </svg>
      <div class="forever-inner">
        <p class="forever-kicker" data-field="forever.subtitle"></p>
        <p class="forever-date"   data-field="weddingDateText"></p>
        <p class="forever-day"    data-field="weddingDayText"></p>
      </div>
    </div>
  </section>


  <!-- ---------- GALLERY ---------- -->
  <section class="sec sec-gallery reveal" id="gallerySec" hidden>
    <h2 class="sec-title" data-field="gallery.heading"></h2>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>


  <!-- ---------- COUNTDOWN ---------- -->
  <section class="sec sec-count reveal">
    <span class="sec-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.2V12l3.2 2"/></svg></span>
    <h2 class="sec-title" data-field="countdown.heading"></h2>
    <div class="count-grid" id="countGrid">
      <div class="count-box"><b id="cdDays">--</b><span data-ui="days"></span></div>
      <div class="count-box"><b id="cdHours">--</b><span data-ui="hours"></span></div>
      <div class="count-box"><b id="cdMins">--</b><span data-ui="minutes"></span></div>
      <div class="count-box"><b id="cdSecs">--</b><span data-ui="seconds"></span></div>
    </div>
    <p class="count-done" id="countDone" data-field="countdown.finished" hidden></p>
  </section>


  <!-- ---------- PROGRAM TIMELINE ---------- -->
  <section class="sec sec-timeline reveal">
    <h2 class="sec-title" data-field="timeline.heading"></h2>
    <ol class="timeline" id="timelineList"></ol>
  </section>


  <!-- ---------- VENUE ---------- -->
  <section class="sec sec-venue reveal">
    <span class="sec-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2s6.8-5.7 6.8-11.1a6.8 6.8 0 1 0-13.6 0c0 5.4 6.8 11.1 6.8 11.1z"/><circle cx="12" cy="9.9" r="2.4"/></svg></span>
    <h2 class="sec-title" data-field="venue.heading"></h2>
    <p class="venue-name"    data-field="venue.name"></p>
    <p class="venue-address" data-field="venue.address"></p>
    <svg class="venue-art" viewBox="0 0 240 100" aria-hidden="true">
      <path d="M12 92h216"/>
      <path d="M78 92V46h84v46"/>
      <path d="M90 46a30 30 0 0 1 60 0"/>
      <path d="M120 16V9"/>
      <path d="M104 92V70a16 16 0 0 1 32 0v22"/>
      <path d="M88 60h10M88 70h10M142 60h10M142 70h10"/>
      <path d="M34 92V60h32v32"/>
      <path d="M34 60a16 16 0 0 1 32 0"/>
      <path d="M50 44v-6"/>
      <path d="M44 72h12M44 80h12"/>
      <path d="M174 92V60h32v32"/>
      <path d="M174 60a16 16 0 0 1 32 0"/>
      <path d="M190 44v-6"/>
      <path d="M184 72h12M184 80h12"/>
    </svg>
    <a class="btn" id="mapsBtn" href="#" target="_blank" rel="noopener"
       data-field="venue.mapsLabel"></a>
  </section>


  <!-- ---------- DRESS CODE ---------- -->
  <section class="sec sec-dress reveal" id="dressSec">
    <span class="sec-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6V7.2a1.9 1.9 0 1 1 1.9-1.9"/><path d="M12 8.6 3.7 15a1.2 1.2 0 0 0 .7 2.2h15.2a1.2 1.2 0 0 0 .7-2.2L12 8.6z"/></svg></span>
    <h2 class="sec-title" data-field="dressCode.heading"></h2>
    <div class="dress-grid">
      <div class="dress-col">
        <h3 data-field="dressCode.women.label"></h3>
        <p data-field="dressCode.women.text"></p>
      </div>
      <span class="dress-div"></span>
      <div class="dress-col">
        <h3 data-field="dressCode.men.label"></h3>
        <p data-field="dressCode.men.text"></p>
      </div>
    </div>
  </section>


  <!-- ---------- PRE-WEDDING EVENTS ---------- -->
  <section class="sec sec-events reveal" id="eventsSec">
    <span class="sec-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l1.8 5.3 5.3 1.8-5.3 1.8L12 17.4l-1.8-5.3-5.3-1.8 5.3-1.8L12 3.2z"/></svg></span>
    <h2 class="sec-title" data-field="events.heading"></h2>
    <div class="events-list" id="eventsList"></div>
  </section>


  <!-- ---------- INFO CARDS ---------- -->
  <section class="sec sec-info reveal" id="infoSec">
    <div class="info-card" id="cardTransport">
      <span class="sec-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="5.8" width="17.6" height="10.4" rx="2"/><path d="M3.2 11.3h17.6"/><circle cx="7.4" cy="18.4" r="1.4"/><circle cx="16.6" cy="18.4" r="1.4"/></svg></span>
      <h2 class="sec-title" data-field="info.transportation.heading"></h2>
      <p data-field="info.transportation.text"></p>
    </div>
    <div class="info-card" id="cardStay">
      <span class="sec-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.2 17.6v-6.2a2 2 0 0 1 2-2h13.6a2 2 0 0 1 2 2v6.2"/><path d="M3.2 14.4h17.6M3.2 17.6v2M20.8 17.6v2"/><path d="M7.2 9.4V7.9a1.5 1.5 0 0 1 1.5-1.5h6.6a1.5 1.5 0 0 1 1.5 1.5v1.5"/></svg></span>
      <h2 class="sec-title" data-field="info.accommodation.heading"></h2>
      <p data-field="info.accommodation.text"></p>
    </div>
    <div class="info-card" id="cardGifts">
      <span class="sec-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.4" y="8.6" width="17.2" height="12" rx="1.6"/><path d="M3.4 13h17.2M12 8.6v12"/><path d="M12 8.6S10.6 4.6 8.7 4.6a2 2 0 0 0 0 4H12zM12 8.6s1.4-4 3.3-4a2 2 0 0 1 0 4H12z"/></svg></span>
      <h2 class="sec-title" data-field="info.gifts.heading"></h2>
      <p data-field="info.gifts.text"></p>
    </div>
  </section>


  <!-- ---------- CLOSING ---------- -->
  <footer class="sec sec-closing reveal">
    <span class="wave" aria-hidden="true"></span>
    <p class="closing-msg"  data-field="closing.message"></p>
    <p class="closing-sign" id="closingSign"></p>
    <span class="wave wave-b" aria-hidden="true"></span>
  </footer>

</main>

<audio id="bgm" loop preload="none"></audio>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
